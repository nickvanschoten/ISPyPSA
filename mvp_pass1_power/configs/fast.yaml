# Pass-1 MVP fast-fallback ISPyPSA config.
#
# Same architecture as baseline.yaml but at smoke-test scale so the end-to-end
# pipeline can be exercised within a single conversation. Used only when the
# full-NEM baseline solve does not converge within the session budget. The
# README documents which config produced the artefacts.
#
# Scope reductions vs baseline.yaml:
#   - NSW only (filter_by_nem_regions: [NSW]) instead of full NEM.
#   - 2 investment periods [2030, 2050] instead of 3.
#   - 1 representative week (residual-peak-demand) instead of 3.
#
# Memory at this scale is ~3-5 GB; solve time ~2-5 min on a developer laptop.

paths:
  run_directory: "mvp_pass1_power/runs"
  ispypsa_run_name: fast_step_change
  parsed_traces_directory: "mvp_pass1_power/data/traces"
  workbook_path: "mvp_pass1_power/data/iasr_2024_v6.0.xlsx"
  parsed_workbook_cache: "mvp_pass1_power/data/workbook_cache"

trace_data:
  dataset_type: example
  dataset_year: 2024

iasr_workbook_version: "6.0"
scenario: Step Change

wacc: 0.07
discount_rate: 0.05

unserved_energy:
  cost: 10000.0
  max_per_node: 100000.0

filter_by_nem_regions: [NSW]

network:
  transmission_expansion: True
  rez_transmission_expansion: True
  annuitisation_lifetime: 30
  nodes:
    regional_granularity: sub_regions
    rezs: discrete_nodes
  rez_to_sub_region_transmission_default_limit: 1e5

temporal:
  year_type: fy
  range:
    start_year: 2030
    end_year: 2050
  capacity_expansion:
    resolution_min: 30
    reference_year_cycle: [2018]
    investment_periods: [2030, 2050]
    aggregation:
      representative_weeks: ~
      named_representative_weeks: [residual-peak-demand]
  operational:
    resolution_min: 30
    reference_year_cycle: [2018]
    horizon: 336
    overlap: 48
    aggregation:
      representative_weeks: ~
      named_representative_weeks: [residual-peak-demand]

solver: highs
create_plots: False
