# v7.8-adjusted: the FINAL workbook's "Flow path cost forecasts" sheet shifted
# every per-flow-path cost table relative to the v7.5 clone. ALL header_rows /
# end_row values below were re-measured against the FINAL workbook (the v7.5
# positions silently read the wrong flow path under config_checks=False).
#
# Three name-mapping notes carried over from the v7.5 quirk (now fixed in-place
# so build_local_cache's v7.5 rename block does NOT fire for 7.8):
#   * slower-growth CNSW-NNSW: v7.5 shipped singular "cost"; canonical "costs".
#   * slower-growth MEL-WNV / SEV-MEL: v7.5 used underscores; canonical dashes.
#
# NNSW-SQ structural note: AEMO splits NNSW-SQ across two blocks on this sheet
# (a small "NNSW-SQ" em-dash block high up, and a "NNSW-SQ" hyphen block lower
# down). As in v7.5, the NNSW-SQ table uses skip_rows to read the first block's
# header and the second block's remaining options as one table.
#
# WNV-SNSW note: the FINAL workbook labels the flow-path code "VIC-SNSW" in the
# data row but keeps the option name "WNV-SNSW Option 1" and the block title
# "WNV-SNSW"; ISPyPSA's canonical table name stays WNV-SNSW.

